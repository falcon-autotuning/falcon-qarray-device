api_version: 1.0.0
instrument:
  vendor: Falcon
  model: QArraySimulator
  identifier: QARRAY
  description: Simulated Quantum Dot Device using QArray
protocol:
  type: Custom
  name: QArray
io:
  - name: config_path
    type: string
    role: setting
    description: Path to device YAML configuration file
  - name: x_gate
    type: string
    role: setting
    description: X axis gate name for 2D scan
  - name: y_gate
    type: string
    role: setting
    description: Y axis gate name for 2D scan
  - name: x_min
    type: float
    role: setting
    unit: V
    description: X axis start voltage
  - name: x_max
    type: float
    role: setting
    unit: V
    description: X axis end voltage
  - name: y_min
    type: float
    role: setting
    unit: V
    description: Y axis start voltage
  - name: y_max
    type: float
    role: setting
    unit: V
    description: Y axis end voltage
  - name: resolution
    type: int
    role: setting
    description: Scan resolution points per axis
  - name: output_stream
    type: buffer
    role: input
    unit: V
    element_type: float
    description: Measurement trace or 2D raster output stream
  - name: source1_voltage
    type: float
    role: output
    description: Voltage to set on gate
    unit: V
  - name: source1_measured_voltage
    type: float
    role: input
    description: Measured DC voltage on gate
    unit: V
