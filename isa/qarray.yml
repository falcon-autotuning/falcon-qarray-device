channel_groups:
  - name: source
    description: Simulated DC gate voltage sources
    channel_parameter:
      name: channel
      type: int
      min: 1
      max: 16
      description: Gate voltage channel index
    io_types:
      - suffix: voltage
        type: float
        role: output
        unit: V
        description: Voltage to set on gate
      - suffix: measured_voltage
        type: float
        role: input
        unit: V
        description: Measured DC voltage on gate
  - name: sensor
    description: Virtual charge sensor readout
    channel_parameter:
      name: channel
      type: int
      min: 1
      max: 8
      description: Sensor channel index
    io_types:
      - suffix: signal
        type: float
        role: input
        unit: V
        description: Scalar charge sensor readout
      - suffix: stream
        type: buffer
        role: input
        unit: V
        element_type: float
        description: Streamed sensor buffer
commands:
  SET_VOLTAGE:
    description: Set DC voltage for gate channel
    channel_group: source
    parameters:
      - io: voltage
    outputs: []
  GET_VOLTAGE:
    description: Read DC voltage for gate channel
    channel_group: source
    parameters: []
    outputs:
      - measured_voltage
  GET_SENSOR_SIGNAL:
    description: Read instantaneous sensor signal
    channel_group: sensor
    parameters: []
    outputs:
      - signal
  SCAN_2D:
    description: Perform 2D scan and return differentiated sensor trace stream
    parameters:
      - io: x_gate
      - io: y_gate
      - io: x_min
      - io: x_max
      - io: y_min
      - io: y_max
      - io: resolution
    outputs:
      - output_stream
  SCAN_1D:
    description: Perform 1D scan on a gate and return sensor trace stream
    channel_group: source
    parameters:
      - io: x_min
      - io: x_max
      - io: resolution
    outputs:
      - output_stream
  RESET:
    description: Reset device state
    parameters: []
    outputs: []